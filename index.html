<style>
/* 레이아웃: 일력(日めくり) 한 장을 넘기듯 — 가운데 한 단, 위에 날짜 머리, 아래에 고정 탭. 강조는 쪽빛 하나, 도장 붉은색은 정답·연속일에만. */
:root{
  --bg:#f6f7f9; --paper:#ffffff; --ink:#1b2230; --sub:#5d6677; --line:#dfe3ea; --soft:#eef1f6;
  --ai:#23466e; --ai-soft:#e4ecf6; --on-ai:#ffffff; --shu:#c8402f; --shu-soft:#fbe9e6; --ok:#2f7d5b; --ok-soft:#e3f3ec;
  --f-ko:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic","Noto Sans KR",sans-serif;
  --f-min:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a2029; --ink:#e8ecf3; --sub:#9aa5b8; --line:#2c3543; --soft:#222a36;
  --ai:#8fb4e3; --ai-soft:#1f2c3f; --on-ai:#0f1622; --shu:#ef7c6c; --shu-soft:#3a211e; --ok:#6cc59c; --ok-soft:#1c3229; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a2029; --ink:#e8ecf3; --sub:#9aa5b8; --line:#2c3543; --soft:#222a36;
  --ai:#8fb4e3; --ai-soft:#1f2c3f; --on-ai:#0f1622; --shu:#ef7c6c; --shu-soft:#3a211e; --ok:#6cc59c; --ok-soft:#1c3229; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
h1,h2,h3,p{margin:0}
.jp{font-family:var(--f-jp)}
ruby rt{font-size:.5em;color:var(--sub);font-family:var(--f-jp);user-select:none}
.nofuri ruby rt{display:none}
.nok .kread{display:none} .nohun .hun{display:none}
/* 머리 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-min);font-weight:800;font-size:22px;letter-spacing:.02em}
.brand small{font-family:var(--f-ko);font-weight:500;font-size:12px;color:var(--sub);margin-left:8px;letter-spacing:0}
.streak{font-size:13px;color:var(--sub);white-space:nowrap}
.streak b{color:var(--shu);font-variant-numeric:tabular-nums}
/* 일력 카드 */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sheet .bind{height:10px;background:var(--ai)}
.sheet .in{padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.daynum{font-family:var(--f-min);font-weight:800;font-size:64px;line-height:1;color:var(--ai);min-width:90px;text-align:center}
.daynum small{display:block;font-family:var(--f-ko);font-size:12px;font-weight:500;color:var(--sub);margin-top:6px}
.sheet .txt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;color:var(--sub);letter-spacing:.06em}
.sheet h2{font-size:20px;font-weight:700;text-wrap:balance}
.meta{font-size:13px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ai);color:var(--on-ai);font-weight:700;padding:11px 18px;border-radius:6px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ai);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 구역 */
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h3 span{font-weight:400;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:center}
.cell b{font-family:var(--f-min);font-size:20px;line-height:1.1}
.cell i{font-style:normal;font-size:10.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.done{border-color:var(--ok);background:var(--ok-soft)} .cell.done b{color:var(--ok)}
.cell.now{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.cell.lock{opacity:.5}
.note{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:6px;padding:10px 12px}
.lv{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--ai)}
/* 탭 */
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:8px}
.tabs button{flex:1;padding:8px 4px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--sub);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.back{color:var(--sub);font-size:13px;align-self:flex-start;padding:6px 0}
/* 어휘 */
.vlist{display:flex;flex-direction:column}
.v{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.v .w{font-family:var(--f-jp);font-size:22px;font-weight:500;line-height:1.9;min-width:0;overflow-wrap:anywhere}
.v .kread{font-size:12px;color:var(--sub)}
.v .m{font-weight:700}
.v .pos{font-size:11px;color:var(--ai);background:var(--ai-soft);border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:500;white-space:nowrap}
.v .hun{font-size:12.5px;color:var(--sub)}
.v .ex{font-family:var(--f-jp);font-size:15px;line-height:2.1;margin-top:4px}
.v .tr{font-size:13px;color:var(--sub)}
.v .body{min-width:0}
.spk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ai);background:var(--paper);flex:none}
.spk svg{width:18px;height:18px}
@media (max-width:480px){.v{grid-template-columns:1fr auto}.v .head{grid-column:1}.v .body{grid-column:1/-1;grid-row:2}}
/* 문형 */
.p{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.p .f{font-family:var(--f-jp);font-size:18px;font-weight:700;color:var(--ai)}
.p .ex{font-family:var(--f-jp);line-height:2.1;margin-top:4px}
/* 독해 */
.rd{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rd h4{margin:0;font-size:14px}
.rd .jp{font-size:16.5px;line-height:2.3}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.ko{font-size:13.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
/* 카드·퀴즈 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:260px;justify-content:center}
.card .big{font-family:var(--f-jp);font-size:44px;line-height:1.8;font-weight:500;overflow-wrap:anywhere}
.card .q{font-size:20px;font-weight:700}
.prog{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.no{background:var(--shu-soft);color:var(--shu)} .btn.yes{background:var(--ok-soft);color:var(--ok)}
.stamp{font-family:var(--f-min);font-weight:800;color:var(--shu);border:3px solid var(--shu);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;font-size:30px;transform:rotate(-8deg)}
/* 가나 */
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{aspect-ratio:1;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;background-image:linear-gradient(var(--soft),var(--soft)),linear-gradient(var(--soft),var(--soft));background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.k b{font-family:var(--f-jp);font-size:clamp(20px,6vw,30px);font-weight:500;line-height:1.1}
.k i{font-style:normal;font-size:11px;color:var(--sub)}
.k.empty{visibility:hidden}
/* 플래시카드 */
.fcbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fr{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.fr>b{font-size:12.5px;color:var(--sub);font-weight:500;padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13.5px;min-height:34px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-weight:700}
[data-flipcard]{cursor:pointer}
/* 한자 */
.k.kj b{font-family:var(--f-min);font-weight:600}
.kjl{font-family:var(--f-jp);font-size:15px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:4px;padding:1px 6px;margin-right:4px;min-height:24px}
.hun .hl{display:block;padding:2px 0;line-height:1.7}
.hun .hl span{font-family:var(--f-jp)}
.kd{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.kd .kbig{font-family:var(--f-min);font-size:96px;line-height:1.1;font-weight:600;text-align:center}
.kd .khun{text-align:center;font-size:18px;font-weight:700}
.kd dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.kd dt{color:var(--sub);font-size:12.5px;padding-top:3px;white-space:nowrap}
.kd dd{margin:0;font-family:var(--f-jp);min-width:0;overflow-wrap:anywhere}
.kw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kw .jp{font-size:18px}
.kw small{display:block;color:var(--sub);font-size:13px}
/* 설정 */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set small{display:block;color:var(--sub);font-size:12px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ai)} .sw[aria-checked="true"]::after{left:21px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}

/* 여행 코너 */
.tlist{display:flex;flex-direction:column;gap:10px}
.tc{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px}
.tile{width:56px;height:56px;border-radius:6px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-family:var(--f-min);font-weight:800;font-size:28px}
.tb{min-width:0;display:flex;flex-direction:column;gap:6px}
.tb h4{margin:0;font-size:16px}
.tb p{font-size:14px}
a.btn{text-decoration:none}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px}
.omap{display:block;width:100%;height:auto;max-width:100%}
.omap .sea{fill:var(--ai-soft)} .omap .river{stroke:var(--ai-soft);stroke-width:7;stroke-linecap:round}
.omap .rail{stroke:var(--shu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .omap .rail.thin{stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.omap .dot{fill:var(--paper);stroke:var(--ai);stroke-width:3}
.omap text{font-family:var(--f-ko);fill:var(--ink)} .omap .lab{font-size:11.5px;font-weight:700} .omap .labj{font-size:9px;fill:var(--sub);font-family:var(--f-jp)} .omap .dir,.omap .seat{font-size:10px;fill:var(--sub)}
/* 아래 탭 */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--sub);min-height:56px;position:relative}
nav button b{font-family:var(--f-min);font-size:19px;line-height:1.1;font-weight:600}
nav button[aria-current="page"]{color:var(--ai)}
nav .badge{position:absolute;top:6px;left:calc(50% + 10px);background:var(--shu);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px;font-variant-numeric:tabular-nums}
</style>

うめい}な{先生|せんせい}です。{私|わたし}たちは{毎日|まいにち}、{漢字|かんじ}とことばを{勉強|べんきょう}します。{難|むずか}しいですが、{楽|たの}しいです。","q":"글의 내용과 맞는 것은?","opts":["학생은 열 명이다","선생님은 나이가 많다","수업은 일주일에 한 번이다","공부가 재미없다"],"ko":"여기는 일본어 교실입니다. 학생이 열 명 있습니다. 선생님은 야마다 선생님입니다. 야마다 선생님은 젊습니다. 아주 친절하고 유명한 선생님입니다. 우리는 매일 한자와 낱말을 공부합니다. 어렵지만 즐겁습니다.","key":"教室 교실 · 若い 젊다 · 有名 유명함 · 毎日 매일","a":0},{"title":"할머니 댁","jp":"{先週|せんしゅう}の{土曜|どよう}{日|び}、{祖母|そぼ}の{家|いえ}に{行|い}きました。{祖母|そぼ}は{八十|はちじゅっ}{歳|さい}ですが、とても{元気|げんき}です。{祖父|そふ}は{五|ご}{年|ねん}{前|まえ}に{亡|な}くなりました。{祖母|そぼ}は{一人|ひとり}で{住|す}んでいます。{私|わたし}は{祖母|そぼ}と{一緒|いっしょ}に{晩|ばん}ご{飯|はん}を{作|つく}りました。とても{楽|たの}しい{一|いち}{日|にち}でした。","q":"할머니에 대한 설명으로 맞는 것은?","opts":["할아버지와 함께 산다","혼자 살고 있다","여든 살이고 몸이 약하다","손자와 함께 산다"],"ko":"지난주 토요일, 할머니 댁에 갔습니다. 할머니는 여든 살이지만 아주 건강하십니다. 할아버지는 오 년 전에 돌아가셨습니다. 할머니는 혼자 살고 계십니다. 저는 할머니와 함께 저녁밥을 만들었습니다. 아주 즐거운 하루였습니다.","key":"祖母 할머니 · 祖父 할아버지 · 元気 건강함 · 一人で 혼자서","a":1},{"title":"인사말","jp":"{日本|にほん}では、{朝|あさ}「おはようございます」と{言|い}います。{昼|ひる}は「こんにちは」、{夜|よる}は「こんばんは」です。{人|ひと}に{何|なに}かをしてもらったときは「ありがとうございます」と{言|い}います。{人|ひと}の{前|まえ}を{通|とお}るときは「すみません」と{言|い}います。あいさつはとても{大切|たいせつ}です。","q":"빈칸에 들어갈 말로 알맞은 것은? (人の前を通るときは「______」と言う。)","opts":["おはようございます","ありがとうございます","すみません","さようなら"],"ko":"일본에서는 아침에 「오하요고자이마스」라고 말합니다. 낮에는 「곤니치와」, 밤에는 「곤반와」입니다. 남에게 무언가를 해 받았을 때는 「아리가토고자이마스」라고 말합니다. 남의 앞을 지나갈 때는 「스미마센」이라고 말합니다. 인사는 아주 중요합니다.","key":"あいさつ 인사 · 通る 지나가다 · 大切 소중함","a":2}]},{"day":2,"theme":"일상 동작 · 생활","vocab":[{"w":"起きる","r":"おきる","k":"오키루","p":"동사","m":"일어나다","h":"起(일어날 기)","e":"{毎朝|まいあさ}{六|ろく}{時|じ}に{起|お}きます。","t":"매일 아침 여섯 시에 일어납니다."},{"w":"寝る","r":"ねる","k":"네루","p":"동사","m":"자다","h":"寝(잘 침)","e":"{昨日|きのう}は{早|はや}く{寝|ね}ました。","t":"어제는 일찍 잤습니다."},{"w":"食べる","r":"たべる","k":"다베루","p":"동사","m":"먹다","h":"食(밥 식)","e":"{朝|あさ}ご{飯|はん}を{食|た}べます。","t":"아침밥을 먹습니다."},{"w":"飲む","r":"のむ","k":"노무","p":"동사","m":"마시다","h":"飲(마실 음)","e":"{毎日|まいにち}{水|みず}を{飲|の}みます。","t":"매일 물을 마십니다."},{"w":"行く","r":"いく","k":"이쿠","p":"동사","m":"가다","h":"行(다닐 행)","e":"{明日|あした}、{学校|がっこう}へ{行|い}きます。","t":"내일 학교에 갑니다."},{"w":"来る","r":"くる","k":"구루" て、{軽|かる}いです。{値段|ねだん}は{少|すこ}し{高|たか}かったですが、いいものです。{本|ほん}もパソコンも{入|はい}ります。とても{気|き}に{入|はい}っています。","q":"새 가방에 대한 설명으로 맞는 것은?","opts":["작고 가볍다","크고 가볍다","크고 무겁다","작고 싸다"],"ko":"어제 새 가방을 샀습니다. 전에 쓰던 가방은 낡고 작았습니다. 새 가방은 크고 가볍습니다. 값은 조금 비쌌지만 좋은 물건입니다. 책도 컴퓨터도 들어갑니다. 아주 마음에 듭니다.","key":"新しい 새롭다 · 古い 낡다 · 大きい 크다 · 高い 비싸다","a":1},{"title":"두 가게","jp":"{駅|えき}の{前|まえ}に{店|みせ}が{二|ふた}つあります。{一|ひと}つは{大|おお}きくて、いろいろな{物|もの}があります。でも、{少|すこ}し{高|たか}いです。もう{一|ひと}つは{小|ちい}さいですが、{安|やす}いです。{私|わたし}はいつも{小|ちい}さいほうの{店|みせ}で{買|か}い{物|もの}します。{店|みせ}の{人|ひと}も{親切|しんせつ}です。","q":"이 사람이 이용하는 가게는?","opts":["크고 물건이 많은 가게","작고 값이 싼 가게","역 안의 가게","비싸지만 가까운 가게"],"ko":"역 앞에 가게가 두 개 있습니다. 하나는 크고 여러 가지 물건이 있습니다. 하지만 조금 비쌉니다. 또 하나는 작지만 쌉니다. 저는 늘 작은 쪽 가게에서장을 봅니다. 가게 사람도 친절합니다.","key":"安い 싸다 · 〜ほう ~쪽 · 親切 친절함","a":1},{"title":"계절","jp":"{日本|にほん}の{夏|なつ}はとても{暑|あつ}いです。{八|はち}{月|がつ}がいちばん{暑|あつ}いです。{冬|ふゆ}は{寒|さむ}いですが、{雪|ゆき}はあまり{降|ふ}りません。{春|はる}と{秋|あき}は{暖|あたた}かくて、いい{天気|てんき}の{日|ひ}が{多|おお}いです。{私|わたし}は{秋|あき}がいちばん{好|す}きです。{空|そら}がきれいだからです。","q":"글쓴이가 가을을 좋아하는 이유는?","opts":["눈이 오지 않아서","하늘이 아름다워서","가장 따뜻해서","사람이 적어서"],"ko":"일본의 여름은 아주 덥습니다. 팔월이 가장 덥습니다. 겨울은 춥지만 눈은 별로 내리지 않습니다. 봄과 가을은 따뜻하고 날씨가 좋은 날이 많습니다.저는 가을을 가장 좋아합니다. 하늘이 아름답기 때문입니다.","key":"暑い 덥다 · 寒い 춥다 · 暖かい 따뜻하다 · いちばん 가장","a":1},{"title":"교실 비교","jp":"{新|あたら}しい{教室|きょうしつ}は{前|まえ}の{教室|きょうしつ}より{広|ひろ}いです。{窓|まど}も{大|おお}きくて、{明|あか}るいです。でも、{少|すこ}しうるさいです。{前|まえ}の{教室|きょうしつ}は{狭|せま}かったですが、{静|しず}かでした。どちらもいいところと{悪|わる}いところがあります。{私|わたし}は{明|あか}るいほうがいいです。","q":"빈칸에 들어갈 말로 알맞은 것은? (前の教室は狭かったですが、______。)","opts":["広かったです","静かでした","うるさかったです","明るかったです"],"ko":"새 교실은 이전 교실보다 넓습니다. 창문도 크고 밝습니다. 하지만 조금 시끄럽습니다. 이전 교실은 좁았지만 조용했습니다. 어느 쪽에도 좋은 점과나쁜 점이 있습니다. 저는 밝은 쪽이 좋습니다.","key":"広い 넓다 · 狭い 좁다 · 静か 조용함 · 〜より ~보다","a":1}]},{"day":6,"theme":"학교 · 공부 · 문구","vocab":[{"w":"教科書","r":"きょうかしょ","k":"교카쇼","p":"명사","m":"교과서","h":"教(가르칠 교) · 科(과목 과) · 書(글 서)","e":"{教科|きょうか}{書|しょ}を{開|ひら}いてください。","t":"교과서를 펴 주세요."},{"w":"ノート","r":"ノート","k":"노토","p":"명사","m":"공책","h":"","e":"ノートに{書|か}きます。","t":"공책에 씁니다."},{"w":"鉛筆","r":"えんぴつ","k":" 는 것"],"ko":"「어떻게 오셨습니까?」 「사흘 전부터 열이 있고 목도 아픕니다.」 「감기네요. 약을 드릴 테니 식사 후에 드세요. 그리고 오늘은 목욕을 하지 마세요. 푹 쉬시면 이삼일이면 낫습니다.」","key":"熱 열 · 痛い 아프다 · 薬 약 · 治る 낫다","a":2},{"title":"아침 습관","jp":"{私|わたし}は{毎朝|まいあさ}、{六|ろく}{時|じ}に{起|お}きます。まず{顔|かお}を{洗|あら}って、{歯|は}を{磨|みが}きます。それから、コップ{一杯|いっぱい}の{水|みず}を{飲|の}みます。{朝|あさ}ご{飯|はん}の{前|まえ}に、{少|すこ}し{体|からだ}を{動|うご}かします。この{習慣|しゅうかん}を{始|はじ}めてから、{体|からだ}の{調子|ちょうし}がよくなりました。","q":"이 사람이 아침에 하지 않는 일은?","opts":["세수","이 닦기","물 마시기","약 먹기"],"ko":"저는 매일 아침 여섯 시에 일어납니다. 먼저 세수를 하고 이를 닦습니다. 그다음 물을 한 컵 마십니다. 아침밥 전에 몸을 조금 움직입니다. 이 습관을시작하고 나서 몸 상태가 좋아졌습니다.","key":"磨く 닦다 · 動く 움직이다 · 体 몸","a":3},{"title":"안경","jp":"{去年|きょねん}から{眼鏡|めがね}をかけています。{目|め}が{悪|わる}くなったからです。{毎日|まいにち}パソコンを{使|つか}う{仕事|しごと}なので、{目|め}がとても{疲|つか}れます。{医者|いしゃ}は「{一|いち}{時間|じかん}に{一|いっ}{回|かい}、{遠|とお}くを{見|み}なさい」と{言|い}いました。それから、{少|すこ}しよくなりました。","q":"의사가 권한 것은?","opts":["안경을 벗을 것","한 시간에 한 번 먼 곳을 볼 것","컴퓨터를 쓰지 말 것","약을 먹을 것"],"ko":"작년부터 안경을 쓰고 있습니다. 눈이 나빠졌기 때문입니다. 매일 컴퓨터를 쓰는 일이라 눈이 아주 피로합니다. 의사는 「한 시간에 한 번 먼 곳을 보시오」라고 말했습니다. 그러고 나서 조금 좋아졌습니다.","key":"眼鏡 안경 · かける 쓰다 · 疲れる 피로하다","a":1},{"title":"조심하십시오","jp":"{雨|あめ}の{日|ひ}は{道|みち}が{危|あぶ}ないです。{自転|じてん}{車|しゃ}に{乗|の}るときは、{特|とく}に{気|き}をつけてください。{急|いそ}いで{走|はし}ると、{転|ころ}んでけがをすることがあります。{傘|かさ}をさして{自転|じてん}{車|しゃ}に{乗|の}ってはいけません。ゆっくり{歩|ある}くほうが{安全|あんぜん}です。","q":"글쓴이가 하지 말라고 한 것은?","opts":["천천히 걷기","우산을 쓰고 자전거 타기","비 오는 날 외출하기","조심해서 걷기"],"ko":"비 오는 날은 길이 위험합니다. 자전거를 탈 때는 특히 조심하세요. 서둘러 달리면 넘어져서 다치는 일이 있습니다. 우산을 쓰고 자전거를 타서는 안됩니다. 천천히 걷는 편이 안전합니다.","key":"危ない 위험하다 · 気をつける 조심하다 · けが 부상","a":1},{"title":"늦잠","jp":"{今朝|けさ}、{寝坊|ねぼう}してしまいました。{昨日|きのう}の{夜|よる}、{遅|おそ}くまで{勉強|べんきょう}していたからです。{時計|とけい}を{見|み}ると{八|はち}{時|じ}{半|はん}でした。{急|いそ}いで{顔|かお}を{洗|あら}って、{朝|あさ}ご{飯|はん}を{食|た}べないで{家|いえ}を{出|で}ました。{授業|じゅぎょう}には{間|ま}に{合|あ}いましたが、お{腹|なか}がすいて______。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["眠かったです","大変でした","楽しかったです","涼しかったです"],"ko":"오늘 아침 늦잠을 자 버렸습니다. 어젯밤 늦게까지 공부하고 있었기 때문입니다. 시계를 보니 여덟 시 반이었습니다. 서둘러 세수를 하고 아침밥을먹지 않고 집을 나섰습니다. 수업에는 늦지 않았지만 배가 고파서 힘들었습니다.","key":"寝坊する 늦잠 자다 · お腹 배 · 大変 힘듦","a":1}]},{"day":9,"theme":"취미 · 여가 pts":["여름에 갔다","호텔에 묵었다","밤에 온천에 들어갔다","아침에 고기를 먹었다"],"ko":"작년 겨울, 가족과 여관에 묵었습니다. 산속의 조용한 여관이었습니다. 밤에는 온천에 들어갔습니다. 밖은 눈이었지만 물은 따뜻해서 기분이 좋았습니다. 아침밥은 생선과 채소로 아주 맛있었습니다. 또 가고 싶습니다.","key":"旅館 여관 · 温泉 온천 · 泊まる 묵다","a":2},{"title":"파티 초대","jp":"「{今度|こんど}の{土曜|どよう}{日|び}、{私|わたし}の{家|いえ}でパーティーをします。よかったら{来|き}ませんか。」「ありがとう。{何時|なんじ}からですか。」「{六|ろく}{時|じ}からです。{飲|の}み{物|もの}はこちらで{用意|ようい}しますから、{何|なに}も{持|も}ってこなくていいですよ。」「じゃあ、ぜひ{行|い}きます。」","q":"초대받은 사람이 가져가야 하는 것은?","opts":["음료","음식","아무것도 없다","선물"],"ko":"「이번 토요일에 저희 집에서 파티를 합니다. 괜찮으시면 오지 않겠습니까?」 「고마워요. 몇 시부터입니까?」 「여섯 시부터입니다. 음료는 저희가 준비할 테니 아무것도 가져오지 않으셔도 됩니다.」 「그럼 꼭 가겠습니다.」","key":"パーティー 파티 · 誘う 권하다 · 用意 준비","a":2},{"title":"오랜만의 축제","jp":"{先週|せんしゅう}の{日曜|にちよう}{日|び}、{町|まち}の{祭|まつ}りに{行|い}きました。{三|さん}{年|ねん}ぶりの{祭|まつ}りだったので、{人|ひと}がとても{多|おお}くて、にぎやかでした。{子供|こども}たちは{踊|おど}りを{踊|おど}っていました。{私|わたし}は{友達|ともだち}に{会|あ}って、{一緒|いっしょ}に{写真|しゃしん}を{撮|と}りました。______{日|ひ}でした。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["つまらない","忙しい","特別な","静かな"],"ko":"지난주 일요일, 마을 축제에 갔습니다. 삼 년 만의 축제여서 사람이 아주 많고 흥겨웠습니다. 아이들은 춤을 추고 있었습니다. 저는 친구를 만나 함께사진을 찍었습니다. 특별한 하루였습니다.","key":"祭り 축제 · にぎやか 흥겨움 · 踊る 춤추다 · 特別 특별함","a":2}]},{"day":10,"theme":"쇼핑 · 돈 · 부사와 접속","vocab":[{"w":"買い物","r":"かいもの","k":"가이모노","p":"명사","m":"쇼핑, 장보기","h":"買(살 매) · 物(물건 물)","e":"スーパーへ{買|か}い{物|もの}に{行|い}きます。","t":"슈퍼에 장을 보러 갑니다."},{"w":"店員","r":"てんいん","k":"덴인","p":"명사","m":"점원","h":"店(가게 점) · 員(인원 원)","e":"{店員|てんいん}に{聞|き}いてみます。","t":"점원에게 물어보겠습니다."},{"w":"値段","r":"ねだん","k":"네단","p":"명사","m":"값, 가격","h":"値(값 치) · 段(층계 단)","e":"{値段|ねだん}が{高|たか}いですね。","t":"값이 비싸네요."},{"w":"お金","r":"おかね","k":"오카네","p":"명사","m":"돈","h":"金(쇠 금)","e":"お{金|かね}が{足|た}りません。","t":"돈이 모자랍니다."},{"w":"財布","r":"さいふ","k":"사이후","p":"명사","m":"지갑","h":"財(재물 재) · 布(베 포)","e":"{財布|さいふ}をなくしました。","t":"지갑을 잃어버렸습니다."},{"w":"払う","r":"はらう","k":"하라우","p":"동사","m":"지불하다","h":"払(떨칠 불)","e":"カードで{払|はら}います。","t":"카드로 지불합니다."},{"w":"売る","r":"うる","k":"우루","p":"동사","m":"팔다","h":"売(팔 매)","e":"この{店|みせ}では{花|はな}を{売|う}っています。","t":"이 가게에서는 꽃을 팔고 있습니다."},{"w":"売り場","r":"うりば","k":"우리바","p "f":"〜は〜より〜です","m":"~은 ~보다 ~합니다","e":"このコートはあのコートより{厚|あつ}いです。","t":"이 코트는 저 코트보다 두껍습니다."},{"f":"〜と同じです","m":"~와 같습니다","e":"{私|わたし}のと{同|おな}じです。","t":"제 것과 같습니다."},{"f":"〜と違います","m":"~와 다릅니다","e":"{写真|しゃしん}と{色|いろ}が{違|ちが}います。","t":"사진과 색이 다릅니다."},{"f":"〜すぎて","m":"너무 ~해서","e":"{大|おお}きすぎて{着|き}られません。","t":"너무 커서 입을 수 없습니다."},{"f":"〜てもいいですか（試す）","m":"~해 봐도 됩니까?","e":"{着|き}てみてもいいですか。","t":"입어 봐도 됩니까?"},{"f":"〜ように見えます","m":"~처럼 보입니다","e":"{高|たか}いように{見|み}えます。","t":"비싸 보입니다."},{"f":"〜みたいです","m":"~인 것 같습니다","e":"{少|すこ}し{小|ちい}さいみたいです。","t":"조금 작은 것 같습니다."},{"f":"〜のはどれですか","m":"~인 것은 어느 것입니까?","e":"あなたのはどれですか。","t":"당신 것은 어느 것입니까?"},{"f":"〜たら（조건）","m":"~하면","e":"{似合|にあ}ったら{買|か}います。","t":"어울리면 사겠습니다."},{"f":"〜ても","m":"~해도","e":"{高|たか}くても{買|か}います。","t":"비싸도 사겠습니다."}],"readings":[{"title":"옷 가게에서","jp":"「このセーター、{着|き}てみてもいいですか。」「どうぞ。サイズはＭとＬがあります。」「Ｍをお{願|ねが}いします。」……「{少|すこ}し{小|ちい}さいみたいです。Ｌはありますか。」「はい、こちらです。{色|いろ}は{白|しろ}と{茶色|ちゃいろ}がありますよ。」「じゃあ、{茶色|ちゃいろ}のＬにします。」","q":"손님이 고른 것은?","opts":["흰색 M","흰색 L","갈색 M","갈색 L"],"ko":"「이 스웨터, 입어 봐도 됩니까?」 「그러세요. 치수는 M과 L이 있습니다.」 「M을 부탁합니다.」…… 「조금 작은 것 같습니다. L은 있습니까?」「네, 이쪽입니다. 색은 흰색과 갈색이 있습니다.」 「그럼 갈색 L로 하겠습니다.」","key":"サイズ 치수 · 試着する 입어 보다 · 色 색","a":3},{"title":"어울리는 색","jp":"{私|わたし}は{地味|じみ}な{色|いろ}が{好|す}きです。{黒|くろ}や{茶色|ちゃいろ}の{服|ふく}をよく{着|き}ます。でも、{姉|あね}は{派手|はで}な{色|いろ}が{好|す}きで、{赤|あか}や{黄色|きいろ}をよく{着|き}ます。{先週|せんしゅう}、{姉|あね}が{赤|あか}いセーターをくれました。{初|はじ}めは{変|へん}だと{思|おも}いましたが、{着|き}てみると{意外|いがい}と{似合|にあ}いました。","q":"글쓴이가 언니에게 받은 것은?","opts":["검은 코트","갈색 치마","빨간 스웨터","노란 모자"],"ko":"저는 수수한 색을 좋아합니다. 검정이나 갈색 옷을 자주 입습니다. 하지만 언니는 화려한 색을 좋아해서 빨강이나 노랑을 자주 입습니다. 지난주 언니가 빨간 스웨터를 주었습니다. 처음에는 이상하다고 생각했지만 입어 보니 뜻밖에 잘 어울렸습니다.","key":"地味 수수함 · 派手 화려함 · 似合う 어울리다","a":2},{"title":"세탁 주의","jp":"この{服|ふく}は{水|みず}で{洗|あら}ってはいけません。{毛|け}のセーターは{洗濯|せんたく}{機|き}に{入|い}れると{小|ちい}さくなります。{木綿|もめん}のシャツは{大丈夫|だいじょうぶ}ですが、{白|しろ}い{物|もの}と{色|いろ}の{濃|こ}い{物|もの}は{別|べつ}に{洗|あら}ってください。{一緒|いっしょ}に{洗|あら}うと、{白|しろ}い{服|ふく}が{汚|よご}れることがあります。","q":"세탁기에 넣으면 안 되는 것은?","opts":["면 셔츠","모직 스웨터","흰 양말","수건"],"ko":"이 옷은 물로 빨아서는 안 됩니다. 모직 스웨터는 세탁기에 넣으면 작아집니다. 면 셔츠는 괜찮지만 흰 것과 색이 짙은 것은 따로 빨아 주세요. 함께빨면 흰옷이 더러워지는 일이 있습니다.","key":"毛 모 · 木綿 면 · 汚れる 더러워지다 · 別 따로","a":1},{"title":"단추","jp":"{昨日|きのう}、{上着|うわぎ}のボタンが{落|お}ちました。{母|はは}に{頼|たの}もうと{思|おも}いましたが、{自分|じぶん}で{縫|ぬ}ってみました。{初|はじ}めてだったので、{時間|じかん}がかかりました。{形|かたち}は{少|すこ}し{変|へん}ですが、{取|と}れません。{自分|じぶん}でできると、うれしいです。","q":"글의 내용과 맞는 것은?","opts":["어머니가 꿰매 주었다","스스로 꿰맸다","가게에 맡겼다","단추를 새로 샀다"],"ko":"어제 겉옷 단추가 떨어졌습니다. 어머니께 부탁하려고 생각했지만 스스로 꿰매 봤습니다. 처음이라 시간이 걸렸습니다. 모양은 조금 이상하지만 떨어지지 않습니다. 스스로 할 수 있으면 기쁩니다.","key":"縫う 꿰매다 · 落ちる 떨어지다 · 変 이상함","a":1},{"title":"두 가방","jp":"{店|みせ}に{二|ふた}つのかばんがあります。{黒|くろ}いかばんは{大|おお}きくて、たくさん{入|はい}りますが、{重|おも}いです。{茶色|ちゃいろ}のかばんは{小|ちい}さくて{軽|かる}いですが、{本|ほん}が{入|はい}りません。{毎日|まいにち}、{教科|きょうか}{書|しょ}を{持|も}っていくので、{私|わたし}には______ほうがいいです。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["軽い","黒い","小さい","安い"],"ko":"가게에 가방이 두 개 있습니다. 검은 가방은 크고 많이 들어가지만 무겁습니다. 갈색 가방은 작고 가볍지만 책이 들어가지 않습니다. 매일 교과서를들고 가기 때문에 저에게는 검은 쪽이 좋습니다.","key":"重い 무겁다 · 軽い 가볍다 · 入る 들어가다","a":1}]},{"day":13,"theme":"직업 · 회사 · 연락","vocab":[{"w":"会議","r":"かいぎ","k":"가이기","p":"명사","m":"회의","h":"会(모일 회) · 議(의논할 의)","e":"{会議|かいぎ}は{三|さん}{時|じ}からです。","t":"회의는 세 시부터입니다."},{"w":"社長","r":"しゃちょう","k":"샤쵸","p":"명사","m":"사장","h":"社(모일 사) · 長(긴 장)","e":"{社長|しゃちょう}が{来|き}ました。","t":"사장님이 오셨습니다."},{"w":"社員","r":"しゃいん","k":"샤인","p":"명사","m":"사원","h":"社(모일 사) · 員(인원 원)","e":"{社員|しゃいん}は{五十|ごじゅう}{人|にん}です。","t":"사원은 오십 명입니다."},{"w":"客","r":"きゃく","k":"갸쿠","p":"명사","m":"손님","h":"客(손 객)","e":"{客|きゃく}が{待|ま}っています。","t":"손님이 기다리고 있습니다."},{"w":"アルバイト","r":"アルバイト","k":"아루바이토","p":"명사","m":"아르바이트","h":"","e":"{土曜|どよう}{日|び}はアルバイトです。","t":"토요일은 아르바이트입니다."},{"w":"事務所","r":"じむしょ","k":"지무쇼","p":"명사","m":"사무실","h":"事(일 사) · 務(힘쓸 무) · 所(바 소)","e":"{事務|じむ}{所|しょ}は{三|さん}{階|がい}です。","t":"사무실은 삼 층입니다."},{"w":"携帯電話","r":"けいたいでんわ","k":"게이타이덴와","p":"명사","m":"휴대전화","h":"携(이끌 휴) · 帯(띠 대) · 電(번 개 전) · 話(말씀 화)","e":"{携帯|けいたい}{電話|でんわ}を{切|き}ってください。","t":"휴대전화를 꺼 주세요."},{"w":"メール","r":"メール","k":"메루","p":"명사","m":"이메일","h":"","e":"メールを{送|おく}りました。","t":"메일을 보냈습니다."}, 末|しゅうまつ}は{子供|こども}と{遊|あそ}んでくれます。{息子|むすこ}は{真面目|まじめ}で、{娘|むすめ}は{明|あか}るい{性格|せいかく}です。{娘|むすめ}は{夫|おっと}によく{似|に}ていると{言|い}われます。","q":"글의 내용과 맞는 것은?","opts":["남편은 주말에도 일한다","아들은 밝은 성격이다","딸은 남편을 닮았다고들 한다","가족은 다섯 명이다"],"a":2,"ko":"우리 가족은 네 명입니다. 남편과 아들과 딸이 있습니다. 남편은 공무원이고 매일 바쁘지만, 주말에는 아이와 놀아 줍니다. 아들은 성실하고 딸은 밝은 성격입니다. 딸은 남편을 많이 닮았다는 말을 듣습니다.","key":"夫 남편 · 息子 아들 · 娘 딸 · 似る 닮다"},{"title":"병문안","jp":"{先週|せんしゅう}、{会社|かいしゃ}の{先輩|せんぱい}が{入院|にゅういん}しました。{昨日|きのう}、{課長|かちょう}と{一緒|いっしょ}にお{見舞|みま}いに{行|い}きました。{先輩|せんぱい}は{思|おも}ったより{元気|げんき}で、{来週|らいしゅう}には{退院|たいいん}できるらしいです。{花|はな}を{渡|わた}すと、とても{喜|よろこ}んでくれました。","q":"선배는 언제 퇴원할 수 있다고 합니까?","opts":["어제","이번 주","다음 주","다음 달"],"a":2,"ko":"지난주에 회사 선배가 입원했습니다. 어제 과장님과 함께 병문안을 갔습니다. 선배는 생각보다 건강했고, 다음 주에는 퇴원할 수 있다고 합니다. 꽃을 건네자 아주 기뻐해 주었습니다.","key":"入院 입원 · お見舞い 병문안 · 退院 퇴원 · 喜ぶ 기뻐하다"},{"title":"새 후배","jp":"{今年|ことし}、{私|わたし}の{課|か}に{新|あたら}しい{後輩|こうはい}が{入|はい}りました。とても{熱心|ねっしん}で、{分|わ}からないことはすぐに{聞|き}いてくれます。{昨日|きのう}は{書類|しょるい}を{間違|まちが}えて{部長|ぶちょう}に{叱|しか}られましたが、すぐに{謝|あやま}って{直|なお}しました。{立派|りっぱ}な{社員|しゃいん}になると{思|おも}います。","q":"후배가 어제 한 일로 맞는 것은?","opts":["부장에게 칭찬을 받았다","잘못을 사과하고 고쳤다","회사를 쉬었다","선배에게 일을 가르쳤다"],"a":1,"ko":"올해 우리 과에 새 후배가 들어왔습니다. 아주 열심이고, 모르는 것은 바로 물어봅니다. 어제는 서류를 틀려서 부장님께 꾸중을 들었지만, 바로 사과하고 고쳤습니다. 훌륭한 사원이 될 거라고 생각합니다.","key":"後輩 후배 · 熱心 열심임 · 叱る 꾸짖다 · 謝る 사과하다"},{"title":"어머니의 가르침","jp":"{子供|こども}のころ、{母|はは}はとても{厳|きび}しかったです。{近所|きんじょ}の{人|ひと}に{会|あ}ったら{必|かなら}ず{挨拶|あいさつ}をしなさい、{人|ひと}に{何|なに}かをしてもらったらお{礼|れい}を{言|い}いなさいと、いつも{言|い}われました。そのときは{嫌|いや}でしたが、{今|いま}は{母|はは}に{感謝|かんしゃ}しています。{私|わたし}も{自分|じぶん}の{子供|こども}に{同|おな}じことを{教|おし}えています。","q":"글쓴이는 지금 어머니를 어떻게 생각합니까?","opts":["너무 엄해서 싫다","고맙게 생각한다","잘 기억나지 않는다","자기와 다르다고 생각한다"],"a":1,"ko":"어릴 때 어머니는 아주 엄했습니다. 이웃 사람을 만나면 반드시 인사를 해라, 남에게 무언가를 받으면 감사 인사를 해라 하고 늘 말씀하셨습니다. 그때는 싫었지만 지금은 어머니께 감사하고 있습니다. 저도 제 아이에게 같은 것을 가르치고 있습니다.","key":"厳しい 엄하다 · 挨拶 인사 · お礼 감사 인사 · 感謝 감사"},{"title":"초대","jp":"{来月|らいげつ}、{友達|ともだち}の{結婚式|けっこんしき}に{招待|しょうたい}されました。お{祝|いわ}いに{何|なに}をあげるか、{妻|つま}と{相談|そうだん}しました。{妻|つま}は「{二人|ふたり}で{使|つか}える{物|もの}がいい」と{言|い}っていました。それで、きれいなカップを{二|ふた}つ{買|か}う______。{喜|よろこ}んでくれると{嬉|うれ}しいです。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["ことにしました","らしいです","のに","ために"],"a":0,"ko":"다음 달에 친구의 결혼식에 초대받았습니다. 축하 선물로 무엇을 줄지 아내와 의논했습니다. 아내는 \"둘이서 쓸 수 있는 물건이 좋다\"고 말했습니다. 그래서 예쁜 컵을 두 개 사기로 했습니다. 기뻐해 주면 좋겠습니다.","key":"招待 초대 · お祝い 축하 선물 · 相談 의논 · 嬉しい 기쁘다"}]},{"day":2,"theme":"집안일 · 생활 · 고장","vocab":[{"w":"生活","r":"せいかつ","k":"세이카쓰","p":"명사","m":"생활","h":"生(날 생) · 活(살 활)","e":"{日本|にほん}の{生活|せいかつ}に{慣|な}れました。","t":"일본 생활에 익숙해졌습니다."},{"w":"暮らす","r":"くらす","k":"구라스","p":"동사","m":"살다, 지내다","h":"暮(저물 모)","e":"{祖母|そぼ}は{一人|ひとり}で{暮|く}らしています。","t":"할머니는 혼자서 살고 계십니다."},{"w":"習慣","r":"しゅうかん","k":"슈칸","p":"명사","m":"습관","h":"習(익힐 습) · 慣(익숙할 관)","e":"{早|はや}く{寝|ね}る{習慣|しゅうかん}をつけましょう。","t":"일찍 자는 습관을 들입시다."},{"w":"片付ける","r":"かたづける","k":"가타즈케루","p":"동사","m":"치우다, 정리하다","h":"片(조각 편) · 付(줄 부)","e":"{食事|しょくじ}の{後|あと}でテーブルを{片付|かたづ}けます。","t":"식사 후에 식탁을 치웁니다."},{"w":"捨てる","r":"すてる","k":"스테루","p":"동사","m":"버리다","h":"捨(버릴 사)","e":"{古|ふる}い{雑誌|ざっし}を{捨|す}てました。","t":"오래된 잡지를 버렸습니다."},{"w":"ごみ","r":"ごみ","k":"고미","p":"명사","m":"쓰레기","h":"","e":"ごみは{朝|あさ}{八時|はちじ}までに{出|だ}してください。","t":"쓰레기는 아침 여덟 시까지 내놓아 주세요."},{"w":"燃える","r":"もえる","k":"모에루","p":"동사","m":"타다","h":"燃(탈 연)","e":"{紙|かみ}はよく{燃|も}えます。","t":"종이는 잘 탑니다."},{"w":"沸かす","r":"わかす","k":"와카스","p":"동사","m":"끓이다","h":"沸(끓을 비)","e":"お{湯|ゆ}を{沸|わ}かしてお{茶|ちゃ}を{入|い}れます。","t":"물을 끓여서 차를 탑니다."},{"w":"焼く","r":"やく","k":"야쿠","p":"동사","m":"굽다","h":"焼(불사를 소)","e":"{朝|あさ}ご{飯|はん}にパンを{焼|や}きます。","t":"아침밥으로 빵을 굽습니다."},{"w":"干す","r":"ほす","k":"호스","p":"동사","m":"널다, 말리다","h":"干(방패 간)","e":"{天気|てんき}がいいので{布団|ふとん}を{干|ほ}します。","t":"날씨가 좋아서 이불을 넙니다."},{"w":"洗濯物","r":"せんたくもの","k":"센타쿠모노","p":"명사","m":"빨래, 세탁물","h":"洗(씻을 세) · 濯(씻을 탁) · 物(물건 물)","e":"{雨|あめ}が{降|ふ}ってきたので{洗濯物|せんたくもの}を{入|い}れました。","t":"비가 내리기 시작해서 빨래를 걷었습니다."},{"w":"乾く","r":"かわく","k":"가와쿠","p":"동사","m":"마르다","h":"乾(마를 건)","e":"シャツはもう{乾|かわ}きました。","t":"셔츠는 벌써 말랐습니다."},{"w":"濡れる","r":"ぬれる","k":"누레루","p":"동사","m":"젖다","h":"濡(적실 유)","e":"{傘|かさ}がなくて{服|ふく}が{濡|ぬ}れました。","t":"우산이 없어서 옷이 젖었습니다."},{"w":"壊す"  아침 여덟 시까지 내야 합니다. 전날 밤에 내면 이웃 사람에게 주의를 받습니다.","key":"ごみ 쓰레기 · 燃える 타다 · 近所 이웃 · 注意 주의"},{"title":"고장 난 세탁기","jp":"{昨日|きのう}、{洗濯機|せんたくき}が{急|きゅう}に{動|うご}かなくなりました。{買|か}ってからまだ{二年|にねん}しかたっていません。{店|みせ}に{電話|でんわ}すると、{修理|しゅうり}は{来週|らいしゅう}の{火曜日|かようび}になると{言|い}われました。それまで、{洗濯物|せんたくもの}は{手|て}で{洗|あら}うことにしました。","q":"세탁기 수리는 언제 합니까?","opts":["오늘","내일","다음 주 화요일","이 년 뒤"],"a":2,"ko":"어제 세탁기가 갑자기 움직이지 않게 되었습니다. 산 지 아직 이 년밖에 지나지 않았습니다. 가게에 전화하니 수리는 다음 주 화요일이 된다고 했습니다. 그때까지 빨래는 손으로 빨기로 했습니다.","key":"故障 고장 · 修理 수리 · 洗濯物 빨래 · 動く 움직이다"},{"title":"집을 비울 때","jp":"{来週|らいしゅう}から{一週間|いっしゅうかん}、{旅行|りょこう}で{留守|るす}にします。{出|で}かける{前|まえ}に、ガスを{止|と}めて、{窓|まど}の{鍵|かぎ}をしっかりかけます。{冷蔵庫|れいぞうこ}の{中|なか}の{物|もの}は{全部|ぜんぶ}{食|た}べるか{捨|す}てます。{隣|となり}の{人|ひと}には{留守|るす}にすることを{伝|つた}えておきました。","q":"글쓴이가 나가기 전에 하지 않는 일은?","opts":["가스를 잠근다","창문을 잠근다","냉장고를 비운다","수도를 고친다"],"a":3,"ko":"다음 주부터 일주일 동안 여행으로 집을 비웁니다. 나가기 전에 가스를 잠그고 창문 자물쇠를 단단히 잠급니다. 냉장고 안의 것은 전부 먹거나 버립니다. 옆집 사람에게는 집을 비운다는 것을 전해 두었습니다.","key":"留守 부재중 · 鍵 열쇠 · 捨てる 버리다 · しっかり 단단히"},{"title":"혼자 사는 생활","jp":"{大学|だいがく}に{入|はい}って、{一人|ひとり}で{暮|く}らし{始|はじ}めました。{最初|さいしょ}は{料理|りょうり}も{掃除|そうじ}も{全然|ぜんぜん}できませんでした。{部屋|へや}はちっとも{片付|かたづ}かないし、{洗濯物|せんたくもの}は{乾|かわ}かないし、{大変|たいへん}でした。でも、このごろは{少|すこ}しずつ{慣|な}れてきました。{母|はは}の{大変|たいへん}さが{分|わ}かりました。","q":"글쓴이가 알게 된 것은?","opts":["요리가 쉽다는 것","어머니가 힘들었다는 것","대학이 재미없다는 것","혼자 사는 것이 편하다는 것"],"a":1,"ko":"대학에 들어가서 혼자 살기 시작했습니다. 처음에는 요리도 청소도 전혀 못 했습니다. 방은 조금도 정리되지 않고 빨래는 마르지 않고 힘들었습니다. 하지만 요즈음은 조금씩 익숙해졌습니다. 어머니의 수고를 알게 되었습니다.","key":"暮らす 살다 · 片付く 정리되다 · 乾く 마르다 · このごろ 요즈음"},{"title":"새 청소기","jp":"{古|ふる}い{掃除機|そうじき}は{重|おも}くて{使|つか}い______。それで、{先週|せんしゅう}{新|あたら}しいのを{買|か}いました。{二|ふた}つの{店|みせ}の{値段|ねだん}を{比|くら}べて、{安|やす}いほうで{買|か}いました。{新|あたら}しい{掃除機|そうじき}は{軽|かる}くて、{音|おと}も{静|しず}かです。{掃除|そうじ}が{楽|たの}しくなりました。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["やすかったです","にくかったです","たがりました","ところです"],"a":1,"ko":"오래된 청소기는 무거워서 쓰기 어려웠습니다. 그래서 지난주에 새것을 샀습니다. 두 가게의 값을 비교해서 싼 쪽에서 샀습니다. 새 청소기는 가볍고 소리도 조용합니다. 청소가 즐거워졌습니다.","key":"掃除機 청소기 · 比べる 비교하다 · 値段 값 · 軽い 가볍다"}]},{"day":3,"theme":"학교 · 공부 · 진로","vocab":[{"w":"小学 "{私|わたし}は{郊外|こうがい}に{住|す}んでいて、{毎朝|まいあさ}{電車|でんしゃ}で{会社|かいしゃ}に{通|かよ}っています。{急行|きゅうこう}に{乗|の}って、{途中|とちゅう}で{地下鉄|ちかてつ}に{乗|の}り{換|か}えます。{片道|かたみち}で{一時間|いちじかん}{半|はん}かかります。{朝|あさ}の{電車|でんしゃ}はとても{込|こ}むので、{席|せき}に{座|すわ}れたことがありません。","q":"글의 내용과 맞는 것은?","opts":["회사 근처에 산다","왕복으로 한 시간 반 걸린다","도중에 지하철로 갈아탄다","아침에는 늘 자리에 앉는다"],"a":2,"ko":"저는 교외에 살고 있어서 매일 아침 전철로 회사에 다닙니다. 급행을 타고 도중에 지하철로 갈아탑니다. 편도로 한 시간 반 걸립니다. 아침 전철은 아주 붐벼서 자리에 앉은 적이 없습니다.","key":"郊外 교외 · 急行 급행 · 乗り換える 갈아타다 · 片道 편도"},{"title":"교통 안전","jp":"{雨|あめ}や{雪|ゆき}の{日|ひ}は{道路|どうろ}が{滑|すべ}りやすくなります。{自転車|じてんしゃ}に{乗|の}るときは、{特|とく}に{注意|ちゅうい}してください。{交差点|こうさてん}では{必|かなら}ず{止|と}まって、{右|みぎ}と{左|ひだり}を{見|み}ましょう。{信号|しんごう}が{青|あお}でも、{急|いそ}いで{渡|わた}るのは{危険|きけん}です。","q":"교차로에서 해야 하는 일은?","opts":["서둘러 건넌다","멈춰서 좌우를 본다","자전거에서 내리지 않는다","신호를 보지 않는다"],"a":1,"ko":"비나 눈이 오는 날은 도로가 미끄러워집니다. 자전거를 탈 때는 특히 주의해 주세요. 교차로에서는 반드시 멈춰서 오른쪽과 왼쪽을 봅시다. 신호가 파란색이어도 서둘러 건너는 것은 위험합니다.","key":"道路 도로 · 注意 주의 · 交差点 교차로 · 危険 위험함"},{"title":"여행 계획","jp":"{来月|らいげつ}、{家族|かぞく}で{北海道|ほっかいどう}へ{行|い}くことになりました。{行|い}きは{飛行機|ひこうき}、{帰|かえ}りは{新幹線|しんかんせん}にする{計画|けいかく}です。{湖|みずうみ}の{周|まわ}りを{歩|ある}いたり、{工場|こうじょう}を{見学|けんがく}したりします。{新幹線|しんかんせん}の{指定席|していせき}はもう{予約|よやく}しました。","q":"돌아올 때 타는 것은?","opts":["비행기","신칸센","배","버스"],"a":1,"ko":"다음 달에 가족끼리 홋카이도에 가게 되었습니다. 갈 때는 비행기, 올 때는 신칸센으로 할 계획입니다. 호수 둘레를 걷기도 하고 공장을 견학하기도 합니다. 신칸센 지정석은 벌써 예약했습니다.","key":"計画 계획 · 新幹線 신칸센 · 見学 견학 · 指定席 지정석"},{"title":"시골과 도시","jp":"{私|わたし}は{田舎|いなか}で{生|う}まれて、{今|いま}は{都会|とかい}に{住|す}んでいます。{都会|とかい}は{交通|こうつう}が{便利|べんり}で、{店|みせ}もたくさんあります。でも、{田舎|いなか}ほど{静|しず}かではありません。{夜|よる}も{車|くるま}の{音|おと}が{聞|き}こえます。ときどき{田舎|いなか}の{海岸|かいがん}を{思|おも}い{出|だ}します。","q":"글쓴이가 도시에 대해 말한 것은?","opts":["교통이 불편하다","가게가 적다","시골만큼 조용하지 않다","밤에는 아주 조용하다"],"a":2,"ko":"저는 시골에서 태어나 지금은 도시에 살고 있습니다. 도시는 교통이 편리하고 가게도 많습니다. 하지만 시골만큼 조용하지는 않습니다. 밤에도 차 소리가 들립니다. 가끔 시골의 바닷가를 떠올립니다.","key":"田舎 시골 · 都会 도시 · 交通 교통 · 海岸 바닷가"},{"title":"길 안내","jp":"「すみません、{駐車場|ちゅうしゃじょう}はどこですか。」「この{通|とお}りをまっすぐ{行|い}って、{二|ふた}つ{目|め}の{信号|しんごう}を{右|みぎ}に{曲|ま}がってください。{踏切|ふみきり}の{手前|てまえ}にあります。」「ありがとうございます。{教|おし}えてもらった______{行|い}っ ,"key":"咳 기침 · 喉 목 · 無理 무리 · 注射 주사"},{"title":"아버지의 퇴원","jp":"{父|ちち}は{先月|せんげつ}、{心臓|しんぞう}の{手術|しゅじゅつ}を{受|う}けました。{二週間|にしゅうかん}{入院|にゅういん}して、{昨日|きのう}{退院|たいいん}しました。{母|はは}が{毎日|まいにち}{病院|びょういん}へ{行|い}って{看病|かんびょう}しました。{医者|いしゃ}に、{毎日|まいにち}{少|すこ}しずつ{歩|ある}くように{言|い}われたので、{朝|あさ}、{父|ちち}と{一緒|いっしょ}に{散歩|さんぽ}することにしました。","q":"의사가 아버지에게 하라고 한 것은?","opts":["매일 조금씩 걷기","이 주 더 입원하기","수영 배우기","단것 먹지 않기"],"a":0,"ko":"아버지는 지난달에 심장 수술을 받았습니다. 이 주 동안 입원하고 어제 퇴원했습니다. 어머니가 매일 병원에 가서 간병했습니다. 의사에게 매일 조금씩 걸으라는 말을 들어서, 아침에 아버지와 함께 산책하기로 했습니다.","key":"心臓 심장 · 手術 수술 · 退院 퇴원 · 看病 간병"},{"title":"살이 빠진 이유","jp":"{去年|きょねん}、{体|からだ}の{具合|ぐあい}が{悪|わる}くなって、{五|ご}キロも{太|ふと}ってしまいました。{原因|げんいん}は{甘|あま}い{物|もの}の{食|た}べすぎと{運動|うんどう}{不足|ぶそく}でした。それで、{週|しゅう}に{三回|さんかい}{水泳|すいえい}を{始|はじ}めました。{半年|はんとし}で{四|よん}キロ{痩|や}せて、{体|からだ}も{丈夫|じょうぶ}になりました。","q":"글쓴이가 시작한 운동은?","opts":["체조","수영","산책","축구"],"a":1,"ko":"작년에 몸 상태가 나빠져서 오 킬로그램이나 쪄 버렸습니다. 원인은 단것을 너무 많이 먹은 것과 운동 부족이었습니다. 그래서 일주일에 세 번 수영을 시작했습니다. 반년 만에 사 킬로그램 빠지고 몸도 튼튼해졌습니다.","key":"具合 상태 · 水泳 수영 · 痩せる 살이 빠지다 · 丈夫 튼튼함"},{"title":"할머니의 요리","jp":"{祖母|そぼ}の{料理|りょうり}は{味|あじ}が{薄|うす}いですが、とてもおいしいです。{台所|だいどころ}からいい{匂|にお}いがすると、{家族|かぞく}がみんな{集|あつ}まってきます。{祖母|そぼ}は「よく{噛|か}んで{食|た}べなさい」といつも{言|い}います。{野菜|やさい}が{多|おお}くて{栄養|えいよう}があるので、{私|わたし}は{祖母|そぼ}の{料理|りょうり}が{大好|だいす}きです。","q":"할머니의 요리에 대해 맞는 것은?","opts":["맛이 진하다","고기가 많다","채소가 많고 영양이 있다","아주 맵다"],"a":2,"ko":"할머니의 요리는 맛이 싱겁지만 아주 맛있습니다. 부엌에서 좋은 냄새가 나면 가족이 모두 모여듭니다. 할머니는 \"잘 씹어서 먹어라\"고 늘 말씀하십니다. 채소가 많고 영양이 있어서 저는 할머니의 요리를 아주 좋아합니다.","key":"味 맛 · 匂い 냄새 · 噛む 씹다 · 栄養 영양"},{"title":"다친 손가락","jp":"{昨日|きのう}、{料理|りょうり}をしているときに{指|ゆび}を{切|き}ってしまいました。{血|ち}がたくさん{出|で}たので、{水|みず}で{洗|あら}って{薬|くすり}を{塗|ぬ}りました。{傷|きず}は{深|ふか}くありませんでしたが、{今日|きょう}はお{皿|さら}を{洗|あら}わ______{休|やす}みます。{夫|おっと}が{代|か}わりに{洗|あら}ってくれるそうです。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["ないで","なくて","さ","がって"],"a":0,"ko":"어제 요리를 하다가 손가락을 베고 말았습니다. 피가 많이 나서 물로 씻고 약을 발랐습니다. 상처는 깊지 않았지만, 오늘은 설거지를 하지 않고 쉽니다. 남편이 대신 씻어 준다고 합니다.","key":"指 손가락 · 血 피 · 塗る 바르다 · 傷 상처"}]},{"day":6,"theme":"일 · 회사 · 경어","vocab":[{"w":"工場","r":"こうじょう","k":"고조","p "일기 예보에 따르면 오늘 밤 태풍이 온다고 합니다. 비뿐만 아니라 바람도 세집니다. 바다 근처에서는 파도가 높아지니 바닷가에 가까이 가지 마세요. 내일 아침은 전철이 멈출지도 모릅니다.","key":"台風 태풍 · 激しい 세차다 · 波 파도 · 海岸 바닷가"},{"title":"할아버지의 밭","jp":"{祖父|そふ}は{村|むら}で{畑|はたけ}の{仕事|しごと}をしています。{土|つち}がいいので、{野菜|やさい}がよく{育|そだ}ちます。でも、{去年|きょねん}は{雨|あめ}が{少|すく}なかったせいで、トマトが{枯|か}れてしまいました。{今年|ことし}は{梅雨|つゆ}に{雨|あめ}がたくさん{降|ふ}ったので、{祖父|そふ}は{喜|よろこ}んでいます。","q":"작년에 토마토가 시든 이유는?","opts":["비가 적어서","태풍이 와서","흙이 나빠서","너무 추워서"],"a":0,"ko":"할아버지는 마을에서 밭일을 하고 있습니다. 흙이 좋아서 채소가 잘 자랍니다. 하지만 작년에는 비가 적었던 탓에 토마토가 시들어 버렸습니다. 올해는 장마에 비가 많이 내려서 할아버지는 기뻐하고 있습니다.","key":"畑 밭 · 土 흙 · 育つ 자라다 · 枯れる 시들다"},{"title":"겨울 호수","jp":"{冬|ふゆ}になると、この{湖|みずうみ}は{凍|こお}ります。{氷|こおり}の{上|うえ}に{雪|ゆき}が{積|つ}もって、{朝|あさ}の{光|ひかり}で{白|しろ}く{光|ひか}ります。とても{美|うつく}しい{景色|けしき}です。でも、{三月|さんがつ}になると{氷|こおり}が{溶|と}け{始|はじ}めるので、{氷|こおり}の{上|うえ}を{歩|ある}くのは{危険|きけん}です。","q":"삼월에 얼음 위를 걷는 것이 위험한 이유는?","opts":["눈이 쌓여서","얼음이 녹기 시작해서","빛이 너무 강해서","호수가 깊어서"],"a":1,"ko":"겨울이 되면 이 호수는 업니다. 얼음 위에 눈이 쌓여 아침 빛에 하얗게 빛납니다. 아주 아름다운 경치입니다. 하지만 삼월이 되면 얼음이 녹기 시작하므로 얼음 위를 걷는 것은 위험합니다.","key":"凍る 얼다 · 積もる 쌓이다 · 光る 빛나다 · 溶ける 녹다"},{"title":"환경을 지키자","jp":"{昔|むかし}、この{川|かわ}はとてもきれいで、{魚|さかな}がたくさんいました。でも、{人|ひと}がごみを{捨|す}てたり、{工場|こうじょう}が{水|みず}を{汚|よご}したりして、{魚|さかな}がいなくなりました。{今|いま}、{町|まち}の{人|ひと}たちは{川|かわ}をきれいにしようとしています。{環境|かんきょう}を{守|まも}れば{守|まも}るほど、{町|まち}は{住|す}みやすくなります。","q":"마을 사람들은 지금 무엇을 하려고 합니까?","opts":["공장을 지으려고 한다","강을 깨끗하게 하려고 한다","물고기를 잡으려고 한다","쓰레기를 태우려고 한다"],"a":1,"ko":"옛날에 이 강은 아주 깨끗해서 물고기가 많이 있었습니다. 하지만 사람이 쓰레기를 버리기도 하고 공장이 물을 더럽히기도 해서 물고기가 없어졌습니다. 지금 마을 사람들은 강을 깨끗하게 하려고 하고 있습니다. 환경을 지키면 지킬수록 마을은 살기 좋아집니다.","key":"汚す 더럽히다 · 環境 환경 · 守る 지키다 · 捨てる 버리다"},{"title":"갑자기 내린 비","jp":"{今日|きょう}は{朝|あさ}から{蒸|む}し{暑|あつ}くて、{空|そら}に{黒|くろ}い{雲|くも}が{浮|う}かんでいました。{午後|ごご}、{公園|こうえん}を{散歩|さんぽ}していると、{急|きゅう}に{雷|かみなり}が{鳴|な}って、{雨|あめ}が{降|ふ}り______。{傘|かさ}がなかったので、{木|き}の{下|した}で{雨|あめ}が{止|や}むのを{待|ま}ちました。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["出しました","ようとしました","らしいです","ほどです"],"a":0,"ko":"오늘은 아침부터 무덥고 하늘에 검은 구름이 떠 있었습니다. 오후에 공원을 산책하고 있는데 갑자기 천둥이 치고 비가 내리기 시작했습니다. 우산이 없어서 나무 아래에서 비가 그치기를 기다렸습니다.","key":" ?","opts":["셔츠를 새로 샀다","셔츠를 큰 치수로 바꿨다","돈을 돌려받았다","영수증을 버렸다"],"a":1,"ko":"어제 백화점에서 산 셔츠는 집에서 입어 보니 조금 작았습니다. 오늘 영수증을 가지고 가게에 갔습니다. 점원은 정중하게 사과하고 큰 치수와 바꿔 주었습니다. 영수증을 버리지 않고 두어서 다행입니다.","key":"デパート 백화점 · レシート 영수증 · 取り替える 바꾸다 · 丁寧 정중함"},{"title":"회원 할인","jp":"この{店|みせ}では、{会員|かいいん}になると{全部|ぜんぶ}の{商品|しょうひん}が{一割|いちわり}{引|び}きになります。{会員|かいいん}になるのにお{金|かね}はかかりません。レジで{名前|なまえ}と{住所|じゅうしょ}を{書|か}くだけです。{毎月|まいつき}{十日|とおか}は、{会員|かいいん}だけ{二割|にわり}{引|び}きです。","q":"매달 십일에 회원은 얼마나 할인받습니까?","opts":["일 할","이 할","삼 할","할인이 없다"],"a":1,"ko":"이 가게에서는 회원이 되면 모든 상품이 일 할 할인됩니다. 회원이 되는 데에 돈은 들지 않습니다. 계산대에서 이름과 주소를 쓰기만 하면 됩니다. 매달 십일은 회원만 이 할 할인입니다.","key":"会員 회원 · 商品 상품 · 割引 할인 · レジ 계산대"},{"title":"소포 보내기","jp":"{国|くに}の{両親|りょうしん}に{贈|おく}り{物|もの}を{送|おく}ることにしました。{絹|きぬ}のハンカチと{日本|にほん}のお{菓子|かし}です。{郵便局|ゆうびんきょく}で{小包|こづつみ}にして{出|だ}しました。{普通|ふつう}なら{一週間|いっしゅうかん}かかりますが、{速達|そくたつ}なら{三日|みっか}で{着|つ}くそうです。{母|はは}の{誕生日|たんじょうび}に{間|ま}に{合|あ}うように、{速達|そくたつ}にしました。","q":"빠른우편으로 보낸 이유는?","opts":["값이 싸서","어머니 생신에 맞추려고","소포가 무거워서","우체국이 권해서"],"a":1,"ko":"고향의 부모님께 선물을 보내기로 했습니다. 비단 손수건과 일본 과자입니다. 우체국에서 소포로 만들어 부쳤습니다. 보통이면 일주일 걸리지만 빠른우편이면 사흘 만에 도착한다고 합니다. 어머니 생신에 맞추려고 빠른우편으로 했습니다.","key":"贈り物 선물 · 小包 소포 · 速達 빠른우편 · 絹 비단"},{"title":"저금","jp":"{私|わたし}は{毎月|まいつき}、{給料|きゅうりょう}の{一割|いちわり}を{貯金|ちょきん}しています。{買|か}い{物|もの}のときは、{本当|ほんとう}に{必要|ひつよう}かどうか{考|かんが}えてから{買|か}います。{迷|まよ}ったときは、{一日|いちにち}{待|ま}つことにしています。そうすると、{買|か}わなくてもいい{物|もの}が{多|おお}いことが{分|わ}かります。","q":"글쓴이는 살지 망설여질 때 어떻게 합니까?","opts":["바로 산다","하루 기다린다","친구에게 묻는다","싼 것을 산다"],"a":1,"ko":"저는 매달 급여의 일 할을 저금하고 있습니다. 장을 볼 때는 정말 필요한지 어떤지 생각하고 나서 삽니다. 망설여질 때는 하루 기다리기로 하고 있습니다. 그렇게 하면 사지 않아도 되는 물건이 많다는 것을 알게 됩니다.","key":"貯金 저금 · 給料 급여 · 迷う 망설이다 · 必要 필요"},{"title":"선물 고르기","jp":"{友達|ともだち}の{結婚|けっこん}のお{祝|いわ}いに{何|なに}を{買|か}うか{迷|まよ}いました。{店員|てんいん}に{聞|き}くと、「このカップは{人気|にんき}があります。{二|ふた}つ{買|か}うと{箱|はこ}{付|つ}きになります」と{教|おし}えてくれました。{色|いろ}の{種類|しゅるい}も{多|おお}かったので、{白|しろ}いカップ______。{気|き}に{入|い}ってくれるといいです。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["にしました","ごとにします","おきにしました","でできています"],"a":0,"ko":"친구의 결혼 축하 선물로 무엇을 살지 망설였습니다. 점원에게 물으니 \"이 컵은 인기 書|どくしょ}です。{小説|しょうせつ}も{漫画|まんが}も{何|なん}でも{読|よ}みます。{電車|でんしゃ}の{中|なか}で{読|よ}み{始|はじ}めると{夢中|むちゅう}になって、{降|お}りる{駅|えき}を{過|す}ぎてしまうことがあります。{兄|あに}はスポーツが{得意|とくい}ですが、{私|わたし}は{苦手|にがて}です。{休|やす}みの{日|ひ}も{家|いえ}で{本|ほん}を{読|よ}んでいます。","q":"글쓴이에 대해 맞는 것은?","opts":["운동을 잘한다","소설만 읽는다","책에 빠져 역을 지나칠 때가 있다","쉬는 날은 밖에 나간다"],"a":2,"ko":"제 취미는 독서입니다. 소설도 만화도 무엇이든 읽습니다. 전철 안에서 읽기 시작하면 푹 빠져서 내릴 역을 지나쳐 버릴 때가 있습니다. 형은 운동을 잘하지만 저는 서툽니다. 쉬는 날에도 집에서 책을 읽고 있습니다.","key":"読書 독서 · 小説 소설 · 夢中 열중함 · 苦手 서투름"},{"title":"여름 축제","jp":"{毎年|まいとし}{八月|はちがつ}に{町|まち}の{祭|まつ}りがあります。{三百年|さんびゃくねん}の{伝統|でんとう}がある{行事|ぎょうじ}です。{今年|ことし}は{浴衣|ゆかた}を{着|き}て{家族|かぞく}と{出|で}かけました。{神社|じんじゃ}の{前|まえ}はとても{賑|にぎ}やかでした。{夜|よる}は{川|かわ}のそばで{花火|はなび}を{見|み}ました。いい{思|おも}い{出|で}になりました。","q":"글쓴이는 밤에 무엇을 했습니까?","opts":["신사에서 춤을 췄다","강가에서 불꽃놀이를 봤다","유카타를 샀다","집에서 텔레비전을 봤다"],"a":1,"ko":"매년 팔월에 마을 축제가 있습니다. 삼백 년의 전통이 있는 행사입니다. 올해는 유카타를 입고 가족과 나갔습니다. 신사 앞은 아주 북적였습니다. 밤에는 강가에서 불꽃놀이를 봤습니다. 좋은 추억이 되었습니다.","key":"伝統 전통 · 浴衣 유카타 · 賑やか 북적임 · 花火 불꽃놀이"},{"title":"전시회 초대","jp":"「{来週|らいしゅう}の{土曜日|どようび}、{絵|え}の{展覧会|てんらんかい}があるんですが、{一緒|いっしょ}に{行|い}きませんか。」「{行|い}きたいんですが、その{日|ひ}は{弟|おとうと}の{試合|しあい}の{応援|おうえん}に{行|い}くんです。」「そうですか。{展覧会|てんらんかい}は{日曜日|にちようび}までですから、{日曜日|にちようび}はどうですか。」「{日曜日|にちようび}なら{大丈夫|だいじょうぶ}です。」","q":"두 사람은 언제 전시회에 갑니까?","opts":["토요일","일요일","다음 달","가지 않는다"],"a":1,"ko":"\"다음 주 토요일에 그림 전시회가 있는데 함께 가지 않겠습니까?\" \"가고 싶은데 그날은 남동생 시합을 응원하러 가거든요.\" \"그렇습니까. 전시회는 일요일까지이니 일요일은 어떻습니까?\" \"일요일이라면 괜찮습니다.\"","key":"展覧会 전시회 · 試合 시합 · 応援 응원 · 大丈夫 괜찮음"},{"title":"배우는 것","jp":"{日本|にほん}の{伝統|でんとう}{文化|ぶんか}に{興味|きょうみ}があったので、{先月|せんげつ}から{書道|しょどう}を{習|なら}い{始|はじ}めました。{最初|さいしょ}は{字|じ}がうまく{書|か}けなくて{苦手|にがて}だと{思|おも}いましたが、{先生|せんせい}が{褒|ほ}めてくださるので、だんだん{楽|たの}しくなってきました。{来年|らいねん}は{茶道|さどう}も{習|なら}ってみたいです。","q":"글쓴이가 지금 배우고 있는 것은?","opts":["다도","서예","꽃꽂이","장기"],"a":1,"ko":"일본의 전통 문화에 흥미가 있어서 지난달부터 서예를 배우기 시작했습니다. 처음에는 글자를 잘 쓰지 못해서 서투르다고 생각했지만, 선생님이 칭찬해 주셔서 점점 즐거워졌습니다. 내년에는 다도도 배워 보고 싶습니다.","key":"伝統 전통 · 書道 서예 · 苦手 서투름 · 茶道 다도"},{"title":"음악회","jp":"{昨日|きのう}、{町|まち}の{劇場|げきじょう}で{音楽会|おんがくかい}がありました。{入場|にゅうじょう}は{無料|むりょう}で  간단합니다. 먼저 양파와 고기를 기름에 볶습니다. 다음으로 물과 감자를 넣고 부드러워질 때까지 삶습니다. 마지막으로 카레 가루를 넣고 섞으면 됩니다. 삼십 분 정도면 됩니다.","key":"炒める 볶다 · 煮る 삶다 · 混ぜる 섞다 · 材料 재료"},{"title":"도시락","jp":"{私|わたし}は{毎朝|まいあさ}{六時|ろくじ}に{起|お}きて、{家族|かぞく}の{弁当|べんとう}を{作|つく}ります。{夏|なつ}は{食|た}べ{物|もの}が{腐|くさ}りやすいので、よく{焼|や}いたり{煮|に}たりした{物|もの}を{入|い}れます。ご{飯|はん}が{冷|さ}めてから{蓋|ふた}をしなくてはいけません。{子供|こども}が{全部|ぜんぶ}{食|た}べてくれると{嬉|うれ}しいです。","q":"도시락 뚜껑은 언제 덮습니까?","opts":["밥이 뜨거울 때","밥이 식은 뒤에","아침 여섯 시에","아이가 먹은 뒤에"],"a":1,"ko":"저는 매일 아침 여섯 시에 일어나서 가족의 도시락을 만듭니다. 여름에는 음식이 상하기 쉬워서 잘 굽거나 삶은 것을 넣습니다. 밥이 식은 뒤에 뚜껑을 덮어야 합니다. 아이가 전부 먹어 주면 기쁩니다.","key":"弁当 도시락 · 腐る 상하다 · 冷める 식다 · 蓋 뚜껑"},{"title":"레스토랑에서","jp":"「いらっしゃいませ。お{飲|の}み{物|もの}は{何|なに}になさいますか。」「{紅茶|こうちゃ}をお{願|ねが}いします。」「{料理|りょうり}は{牛肉|ぎゅうにく}と{鶏肉|とりにく}がございますが、どちらになさいますか。」「{鶏肉|とりにく}にします。{辛|から}くないですか。」「はい、{辛|から}くありません。」","q":"손님이 고른 것은?","opts":["홍차와 소고기","홍차와 닭고기","커피와 닭고기","맥주와 소고기"],"a":1,"ko":"\"어서 오세요. 음료는 무엇으로 하시겠습니까?\" \"홍차를 부탁합니다.\" \"요리는 소고기와 닭고기가 있습니다만 어느 쪽으로 하시겠습니까?\" \"닭고기로 하겠습니다. 맵지 않습니까?\" \"네, 맵지 않습니다.\"","key":"飲み物 음료 · 紅茶 홍차 · 牛肉 소고기 · 鶏肉 닭고기"},{"title":"어머니의 된장국","jp":"{母|はは}の{味噌汁|みそしる}は{豆腐|とうふ}と{玉|たま}ねぎが{入|はい}っています。{味|あじ}は{濃|こ}くありませんが、とてもおいしいです。{一人|ひとり}で{暮|く}らし{始|はじ}めてから、{自分|じぶん}でも{作|つく}ってみました。でも、いくら{作|つく}っても{母|はは}の{味|あじ}になりません。{今度|こんど}{帰|かえ}ったら、{作|つく}り{方|かた}を{教|おし}えてもらうつもりです。","q":"글쓴이는 다음에 집에 가면 무엇을 할 생각입니까?","opts":["된장국을 사 온다","만드는 법을 배운다","어머니에게 요리를 해 준다","두부를 가져온다"],"a":1,"ko":"어머니의 된장국에는 두부와 양파가 들어 있습니다. 맛은 진하지 않지만 아주 맛있습니다. 혼자 살기 시작하고 나서 직접 만들어 봤습니다. 하지만 아무리 만들어도 어머니의 맛이 나지 않습니다. 다음에 집에 가면 만드는 법을 배울 생각입니다.","key":"味噌 된장 · 豆腐 두부 · 濃い 진하다 · 作り方 만드는 법"},{"title":"남기지 않기","jp":"{子供|こども}のころ、{私|わたし}は{野菜|やさい}が{嫌|きら}いで、よく{残|のこ}していました。{母|はは}は「{残|のこ}し______」といつも{言|い}いました。{今|いま}は{自分|じぶん}で{料理|りょうり}をするので、{材料|ざいりょう}を{作|つく}った{人|ひと}のことを{考|かんが}えます。{新鮮|しんせん}な{野菜|やさい}は{本当|ほんとう}においしいと{思|おも}います。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["てはだめです","ばいいです","だけでいいです","てみてください"],"a":0,"ko":"어릴 때 저는 채소를 싫어해서 자주 남겼습니다. 어머니는 \"남기면 안 돼\"라고 늘 말했습니다. 지금은 직접 요리를 하기 때문에 재료를 만든 사람을 생각합니다. 신선한 채소는 정말 맛있다고 생각합니다.","ke 는 글쓴이에게 무엇을 해 주었습니까?","opts":["화를 냈다","격려해 주었다","함께 울었다","시합을 그만두라고 했다"],"a":1,"ko":"어제 시합에서 제 실수 탓에 팀이 지고 말았습니다. 너무 분해서 혼자 울고 있었습니다. 그때 동료가 \"혼자서 고민할 필요 없어. 다시 함께 힘내자\"라고 격려해 주었습니다. 그 말에 마음이 차분해졌습니다.","key":"悔しい 분하다 · 仲間 동료 · 励ます 격려하다 · 落ち着く 차분해지다"},{"title":"형과 나","jp":"{兄|あに}と{私|わたし}は{性格|せいかく}が{全然|ぜんぜん}{違|ちが}います。{兄|あに}は{自信|じしん}があって、{誰|だれ}とでもすぐ{話|はな}せます。{私|わたし}はおとなしくて、{知|し}らない{人|ひと}の{前|まえ}では{緊張|きんちょう}します。{子供|こども}のころは{兄|あに}が{羨|うらや}ましかったですが、{今|いま}は{自分|じぶん}の{性格|せいかく}も{悪|わる}くないと{思|おも}っています。","q":"글쓴이의 성격으로 맞는 것은?","opts":["자신감이 있다","누구와도 금방 말한다","얌전하고 낯선 사람 앞에서 긴장한다","제멋대로다"],"a":2,"ko":"형과 저는 성격이 전혀 다릅니다. 형은 자신감이 있고 누구와도 금방 이야기할 수 있습니다. 저는 얌전하고 모르는 사람 앞에서는 긴장합니다. 어릴 때는 형이 부러웠지만, 지금은 제 성격도 나쁘지 않다고 생각합니다.","key":"性格 성격 · 自信 자신감 · おとなしい 얌전하다 · 羨ましい 부럽다"},{"title":"사과","jp":"{昨日|きのう}、{友達|ともだち}の{秘密|ひみつ}をほかの{人|ひと}に{話|はな}してしまいました。{友達|ともだち}はとても{怒|おこ}りました。{私|わたし}は{正直|しょうじき}に「{勝手|かって}に{話|はな}してすみません」と{謝|あやま}りました。{友達|ともだち}は{少|すこ}し{考|かんが}えてから、{許|ゆる}してくれました。もう{二度|にど}と{同|おな}じことはしません。","q":"글쓴이가 한 잘못은?","opts":["친구의 비밀을 남에게 말했다","친구에게 거짓말을 했다","친구의 물건을 마음대로 썼다","친구와의 약속을 잊었다"],"a":0,"ko":"어제 친구의 비밀을 다른 사람에게 말해 버렸습니다. 친구는 아주 화를 냈습니다. 저는 정직하게 \"마음대로 말해서 미안합니다\"라고 사과했습니다. 친구는 조금 생각하고 나서 용서해 주었습니다. 다시는 같은 일을 하지 않겠습니다.","key":"秘密 비밀 · 正直 정직함 · 勝手 제멋대로임 · 許す 용서하다"},{"title":"어머니께","jp":"{子供|こども}のころ、{私|わたし}は{我|わ}がままで、{母|はは}によく{迷惑|めいわく}をかけました。{嫌|きら}いな{習|なら}い{事|ごと}に{行|い}かせられて、{泣|な}いたこともあります。でも{今|いま}は、{母|はは}が{私|わたし}のことを{考|かんが}えてくれていたのが{分|わ}かります。{母|はは}を{尊敬|そんけい}しているし、{心|こころ}から{感謝|かんしゃ}しています。","q":"글쓴이는 지금 어머니를 어떻게 생각합니까?","opts":["불만이 있다","존경하고 감사한다","의심한다","무섭다고 생각한다"],"a":1,"ko":"어릴 때 저는 제멋대로여서 어머니께 자주 폐를 끼쳤습니다. 싫어하는 것을 억지로 배우러 가서 운 적도 있습니다. 하지만 지금은 어머니가 저를 생각해 주고 있었다는 것을 압니다. 어머니를 존경하고 진심으로 감사하고 있습니다.","key":"我がまま 제멋대로임 · 迷惑 폐 · 尊敬 존경 · 感謝 감사"},{"title":"걱정","jp":"{来週|らいしゅう}、{初|はじ}めて{一人|ひとり}で{外国|がいこく}へ{行|い}きます。{言葉|ことば}が{通|つう}じるかどうか{不安|ふあん}です。{友達|ともだち}に{話|はな}すと、「{困|こま}ったら{周|まわ}りの{人|ひと}に{頼|たよ}ればいいよ。そんなに{心配|しんぱい}する______」と{言|い}われました。{少|すこ}し{勇気|ゆうき}が{出|で}てきました。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["ことはないよ","気がするよ","ばいいのに","わけではないよ"],"a":0,"ko":"다음 주에 처음으로 혼자 외국에 갑니다. 말이 통할지 어떨지 불안합니다. 친구에게 말하니 \"곤란하면 주위 사람에게 의지하면 돼. 그렇게 걱정할 필요 없어\"라고 했습니다. 조금 용기가 났습니다.","key":"不安 불안함 · 頼る 의지하다 · 心配 걱정 · 勇気 용기"}]},{"day":12,"theme":"사회 · 뉴스 · 생각","vocab":[{"w":"世の中","r":"よのなか","k":"요노나카","p":"명사","m":"세상","h":"世(인간 세) · 中(가운데 중)","e":"{世|よ}の{中|なか}にはいろいろな{人|ひと}がいます。","t":"세상에는 여러 사람이 있습니다."},{"w":"政府","r":"せいふ","k":"세이후","p":"명사","m":"정부","h":"政(정사 정) · 府(마을 부)","e":"{政府|せいふ}が{新|あたら}しい{計画|けいかく}を{発表|はっぴょう}しました。","t":"정부가 새 계획을 발표했습니다."},{"w":"工業","r":"こうぎょう","k":"고교","p":"명사","m":"공업","h":"工(장인 공) · 業(업 업)","e":"この{町|まち}は{工業|こうぎょう}が{盛|さか}んです。","t":"이 도시는 공업이 활발합니다."},{"w":"農業","r":"のうぎょう","k":"노교","p":"명사","m":"농업","h":"農(농사 농) · 業(업 업)","e":"{祖父|そふ}は{農業|のうぎょう}をしています。","t":"할아버지는 농업을 하고 있습니다."},{"w":"商業","r":"しょうぎょう","k":"쇼교","p":"명사","m":"상업","h":"商(장사 상) · 業(업 업)","e":"{大阪|おおさか}は{昔|むかし}から{商業|しょうぎょう}の{町|まち}です。","t":"오사카는 옛날부터 상업의 도시입니다."},{"w":"戦争","r":"せんそう","k":"센소","p":"명사","m":"전쟁","h":"戦(싸움 전) · 争(다툴 쟁)","e":"{戦争|せんそう}のない{世界|せかい}を{望|のぞ}みます。","t":"전쟁 없는 세계를 바랍니다."},{"w":"平和","r":"へいわ","k":"헤이와","p":"명사","m":"평화","h":"平(평평할 평) · 和(화할 화)","e":"{平和|へいわ}の{大切|たいせつ}さを{学|まな}びました。","t":"평화의 소중함을 배웠습니다."},{"w":"事件","r":"じけん","k":"지켄","p":"명사","m":"사건","h":"事(일 사) · 件(물건 건)","e":"{近所|きんじょ}で{事件|じけん}が{起|お}こりました。","t":"근처에서 사건이 일어났습니다."},{"w":"泥棒","r":"どろぼう","k":"도로보","p":"명사","m":"도둑","h":"泥(진흙 니) · 棒(막대 봉)","e":"{留守|るす}の{間|あいだ}に{泥棒|どろぼう}に{入|はい}られました。","t":"집을 비운 사이에 도둑이 들었습니다."},{"w":"警官","r":"けいかん","k":"게이칸","p":"명사","m":"경찰관","h":"警(경계할 경) · 官(벼슬 관)","e":"{警官|けいかん}に{道|みち}を{聞|き}きました。","t":"경찰관에게 길을 물었습니다."},{"w":"犯人","r":"はんにん","k":"한닌","p":"명사","m":"범인","h":"犯(범할 범) · 人(사람 인)","e":"{犯人|はんにん}はまだ{見|み}つかっていません。","t":"범인은 아직 잡히지 않았습니다."},{"w":"裁判","r":"さいばん","k":"사이반","p":"명사","m":"재판","h":"裁(마를 재) · 判(판단할 판)","e":"その{事件|じけん}の{裁判|さいばん}が{始|はじ}まりました。","t":"그 사건의 재판이 시작되었습니다."},{"w":"選挙","r":"せんきょ","k":"센쿄","p":"명사","m":"선거","h":"選(가릴 선) · 挙(들 거)","e":"{来月|らいげつ}、{市長|しちょう}の{選挙|せんきょ}があります。"  안내","jp":"このデパートは{八階|はっかい}{建|だ}てです。{食料品|しょくりょうひん}は{地下|ちか}、{服|ふく}は{二階|にかい}から{四階|よんかい}にかけて{売|う}っています。{屋上|おくじょう}には{子供|こども}の{遊|あそ}び{場|ば}があります。{上|うえ}の{階|かい}へは、{入口|いりぐち}の{奥|おく}のエスカレーターをご{利用|りよう}ください。","q":"옥상에는 무엇이 있습니까?","opts":["식료품 매장","옷 매장","아이들의 놀이터","안내소"],"a":2,"ko":"이 백화점은 팔 층짜리입니다. 식료품은 지하, 옷은 이 층에서 사 층에 걸쳐 팔고 있습니다. 옥상에는 아이들의 놀이터가 있습니다. 위층으로는 입구 안쪽의 에스컬레이터를 이용해 주세요.","key":"地下 지하 · 屋上 옥상 · 入口 입구 · 奥 안쪽"},{"title":"길 묻기","jp":"{道|みち}が{分|わ}からなくなったので、{駅前|えきまえ}の{交番|こうばん}で{聞|き}きました。{警官|けいかん}は「この{川|かわ}に{沿|そ}って{五分|ごふん}ぐらい{歩|ある}くと、{右側|みぎがわ}に{白|しろ}いビルがあります。{美術館|びじゅつかん}はその{隣|となり}です」と{教|おし}えてくれました。","q":"미술관은 어디에 있습니까?","opts":["역 앞 파출소 옆","강을 따라 걸으면 나오는 흰 빌딩 옆","강 건너편","상점가 안쪽"],"a":1,"ko":"길을 모르게 되어서 역 앞 파출소에서 물었습니다. 경찰관은 \"이 강을 따라 5분쯤 걸으면 오른쪽에 흰 빌딩이 있습니다. 미술관은 그 옆입니다\"라고 가르쳐 주었습니다.","key":"駅前 역 앞 · 交番 파출소 · 沿う 따르다 · 右側 오른쪽"},{"title":"새집","jp":"{先月|せんげつ}、{会社|かいしゃ}の{寮|りょう}を{出|で}て、マンションに{移|うつ}りました。{駅|えき}から{少|すこ}し{離|はな}れていますが、{南|みなみ}{向|む}きで{明|あか}るい{部屋|へや}です。{天井|てんじょう}も{高|たか}くて、{広|ひろ}さも{十分|じゅうぶん}です。ただ、{近|ちか}くに{店|みせ}が{少|すく}ないのが{少|すこ}し{不便|ふべん}です。","q":"새집의 불편한 점은?","opts":["방이 어둡다","천장이 낮다","근처에 가게가 적다","방이 좁다"],"a":2,"ko":"지난달에 회사 기숙사를 나와 아파트로 옮겼습니다. 역에서 조금 떨어져 있지만 남향이라 밝은 방입니다. 천장도 높고 넓이도 충분합니다. 다만 근처에 가게가 적은 것이 조금 불편합니다.","key":"寮 기숙사 · 移る 옮기다 · 離れる 떨어지다 · 天井 천장"},{"title":"산에 둘러싸인 마을","jp":"{私|わたし}の{町|まち}は{山|やま}に{囲|かこ}まれた{小|ちい}さい{町|まち}です。{県|けん}の{中心|ちゅうしん}からかなり{距離|きょり}があって、{車|くるま}で{二時間|にじかん}かかります。{山|やま}を{越|こ}えると{海|うみ}があって、{夏|なつ}は{町中|まちじゅう}の{人|ひと}が{泳|およ}ぎに{行|い}きます。","q":"이 마을에 대해 맞는 것은?","opts":["바다에 둘러싸여 있다","현의 중심에서 가깝다","산을 넘으면 바다가 있다","차로 갈 수 없다"],"a":2,"ko":"우리 마을은 산에 둘러싸인 작은 마을입니다. 현의 중심에서 꽤 거리가 있어서 차로 두 시간 걸립니다. 산을 넘으면 바다가 있어서 여름에는 온 마을 사람이 수영하러 갑니다.","key":"囲む 둘러싸다 · 県 현 · 距離 거리 · 越える 넘다"},{"title":"대피 훈련","jp":"{学校|がっこう}で{地震|じしん}の{練習|れんしゅう}がありました。まず{机|つくえ}の{下|した}に{入|はい}って、それから{廊下|ろうか}に{出|で}ます。{非常口|ひじょうぐち}______{静|しず}かに{歩|ある}いて、{体育館|たいいくかん}に{集|あつ}まりました。{先生|せんせい}は「{走|はし}らないことが{大切|たいせつ}です」と{言|い}いました。","q":"빈칸에 들어갈 말로 알맞은 것은?","opts":["に向かって","建ての","向きの","にかけて"],"a":0 <script>
(function(){

(function(){var seen={};['N5','N4'].forEach(function(L){LV[L].forEach(function(D,di){var g=[];D.vocab.forEach(function(v,i){for(var n=0;n<v.w.length;n++){var c=v.w[n];if(!KJ[c])continue;(KW[c]=KW[c]||[]).push([L,di,i]);if(!seen[c]){seen[c]=1;g.push(c)}}});KG[L].push(g)})})})();
function dk(lv,day){return lv==='N5'?day:lv+'-'+day}
function cur(){var p=String(arg||'').split('-');var L=LV[p[0]];return L?{lv:p[0],D:L[+p[1]-1]}:{lv:'N5',D:null}}

var KEY='ichinichi.v1';
var S={done:{},srs:{},days:[],opt:{furi:true,kread:true,hun:true,rate:0.9}};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k]; S.opt=Object.assign({furi:true,kread:true,hun:true,rate:0.9},S.opt||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dayNo(s){var p=s.split('-');return Math.round(Date.UTC(+p[0],p[1]-1,+p[2])/864e5)}
function touch(){var t=today(); if(S.days.indexOf(t)<0){S.days.push(t); save();}}
function streak(){var set={};S.days.forEach(function(d){set[dayNo(d)]=1});var n=dayNo(today()),c=0; if(!set[n]) n--; while(set[n]){c++;n--} return c}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ruby(s){return esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')}
function plain(s){return s.replace(/\{([^|}]+)\|[^}]+\}/g,'$1')}
function kanaOf(s){return s.replace(/\{[^|}]+\|([^}]+)\}/g,'$1')}
function wruby(v){return v.r&&v.r!==v.w&&/[一-龥々]/.test(v.w)?'<ruby>'+esc(v.w)+'<rt>'+esc(v.r)+'</rt></ruby>':esc(v.w)}
/* 음성: 기기의 일본어 음성으로 읽어 줍니다 */

function spk(t,label){return '<button class="spk" data-say="'+esc(t)+'" aria-label="'+esc(label||'소리 듣기')+'">'+SPK+'</button>'}
/* 복습(간격 반복): 틀린 것은 1일 뒤, 맞힐 때마다 3·7·14일로 늘어납니다 */
var GAP=[1,3,7,14];
function id(lv,d,i){return lv.toLowerCase()+'-'+d+'-'+i}
function item(key){var p=key.split('-');var L=LV[p[0].toUpperCase()];var D=L&&L[+p[1]-1];return D&&D.vocab[+p[2]]}
function miss(key){S.srs[key]={b:0,due:dayNo(today())+GAP[0]};save()}
function hit(key){var r=S.srs[key];if(!r)return;r.b++;if(r.b>=GAP.length){delete S.srs[key]}else{r.due=dayNo(today())+GAP[r.b]}save()}
function dueList(){var n=dayNo(today());return Object.keys(S.srs).filter(function(k){return S.srs[k].due<=n&&item(k)})}

function doneCount(lv){return LV[lv].filter(function(x){return S.done[dk(lv,x.day)]}).length}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  var h=v==='day'?String(a).toLowerCase():v; if(location.hash!=='#'+h){try{location.hash=h}catch(e){}}}
function render(){

  ['N5','N4'].forEach(function(L){var A=LV[L],cnt=doneCount(L),nx=nextDay(L);

  if(d.card){var s=sess,k=s.q[s.i];if(d.card==='flip'){s.flip=true;cardSay(k)}else{if(d.card==='ok'){s.ok++;if(s.kind==='review')hit(k)}else{s.no++;(s.wrong=s.wrong||[]).push(k);if(!isK(k))miss(k)}s.i++;s.flip=false}render();return}
  if(d.endcards){sess=null;render();return}
  if(d.quiz){var C2=cur(),D2=C2.D;if(d.quiz==='start'){sess={kind:'quiz',q:makeQuiz(D2,C2.lv),i:0,ok:0,pick:null};touch()}else{sess.i++;sess.pick=null;if(sess.i>=sess.q.length&&sess.ok>=8){S.done[dk(C2.lv,D2.day)]=today();save()}}render();return}
  if(d.pick!=null){var q=sess.q[sess.i];sess.pick=+d.pick;if(sess.pick===q.ans){sess.ok++}else if(q.key){miss(q.key)}if(q.say)say(q.say);render();return}
  if(d.opt!=null){var art=t.closest('.rd'),R=cur().D.readings[+art.dataset.rd],box=t.closest('.opts');box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;if(+b.dataset.opt===R.a)b.classList.add('right');else if(b===t)b.classList.add('wrong')});var ko=art.querySelector('.ko'),kb=art.querySelector('[data-ko]');ko.hidden=false;kb.textContent='해석 접기';touch();return}
  if(d.ko){var k2=t.nextElementSibling;k2.hidden=!k2.hidden;t.textContent=k2.hidden?'해석 보기':'해석 접기';return}
  if(d.ttab){ttab=d.ttab;render();return}
  if(d.kset){kset=d.kset;sess=null;render();return}
  if(d.kq){if(d.kq==='start'){var all=G.concat(G2).filter(Boolean);sess={kind:'kq',i:0,ok:0,pick:null,q:shuffle(all).slice(0,10).map(function(c){var o=shuffle(all.filter(function(x){return x[1]!==c[1]})).slice(0,3);return {c:c,o:shuffle([c].concat(o))}})}}else if(d.kq==='next'){sess.i++;sess.pick=null}else{sess=null}render();return}
  if(d.kpick!=null){var kq=sess.q[sess.i];sess.pick=+d.kpick;if(kq.o[sess.pick]===kq.c)sess.ok++;say(kq.c[0]);render();return}
  if(d.sw){S.opt[d.sw]=!S.opt[d.sw];save();render();return}
  if(d.rate){S.opt.rate=+d.rate;save();render();return}
  if(d.reset){if(d.reset==='ask'){sess={kind:'reset'}}else{if(d.reset==='yes'){S.done={};S.srs={};S.days=[];save()}sess=null}render();return}
});
function fromHash(){var h=(location.hash||'').slice(1),m=h.match(/^(n[45])-(\d+)$/);if(m&&LV[m[1].toUpperCase()][+m[2]-1]){view='day';arg=m[1].toUpperCase()+'-'+(+m[2])}else if(['home','kana','kanji','review','options','travel'].indexOf(h)>=0){view=h}render()}
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1),cur=view==='day'?String(arg).toLowerCase():view;if(h===cur)return;sess=null;fromHash();window.scrollTo(0,0)});
fromHash();
})();
</script>
